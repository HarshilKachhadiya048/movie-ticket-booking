# ---------------------------------------------------------------------------
# Test profile.
#
# The datasource is NOT configured here on purpose: every integration test
# obtains one from the Testcontainers PostgreSQL container wired through
# @ServiceConnection (see PostgresContainerSupport).
# ---------------------------------------------------------------------------

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# The concurrency test fires 20+ simultaneous hold attempts, each of which
# holds a connection while it blocks on a PostgreSQL row lock. A pool smaller
# than the thread count would make threads queue for a connection rather than
# for the lock, which would still pass but would no longer be testing what it
# claims to test.
spring.datasource.hikari.maximum-pool-size=32
spring.datasource.hikari.minimum-idle=4

# Tests run against the schema only. Demo seed data lives in db/seed and is
# deliberately excluded so that fixtures are explicit and tests stay isolated.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=false

# Schedulers are disabled by default so that background sweeps cannot race with
# assertions. The tests that exercise the sweeper enable it explicitly or invoke
# the sweep method directly.
booking.hold-sweeper.enabled=false
notification.reminder.enabled=false

booking.hold-duration=5m
booking.currency=INR
booking.max-seats-per-booking=10

payment.mock.latency=0ms

# A single-threaded, synchronous-ish executor keeps async notification
# assertions deterministic without changing the production wiring.
notification.executor.core-pool-size=1
notification.executor.max-pool-size=1
notification.executor.queue-capacity=100

logging.level.com.harshil.movieticketbooking=INFO
logging.level.org.testcontainers=WARN
logging.level.com.github.dockerjava=WARN
