spring.application.name=movie-ticket-booking

# ---------------------------------------------------------------------------
# Datasource
# Credentials are never hard-coded in Java; every value below is overridable
# through the matching SPRING_DATASOURCE_* environment variable.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5433/movie_ticket_booking
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.pool-name=mtb-pool

# ---------------------------------------------------------------------------
# JPA / Hibernate
# Flyway owns the schema. Hibernate only validates that entities match it.
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true

# ---------------------------------------------------------------------------
# Flyway
# db/migration holds the schema; db/seed holds demo catalogue data so that a
# freshly started local instance is immediately explorable. The test profile
# drops db/seed and builds its own fixtures instead.
# ---------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/seed

# ---------------------------------------------------------------------------
# Transactions / timestamps
# ---------------------------------------------------------------------------
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

# ---------------------------------------------------------------------------
# Booking + seat hold behaviour
# hold-duration drives both the hold expiry written on show_seats and the
# lazy-expiry comparison performed while seats are locked.
# ---------------------------------------------------------------------------
booking.hold-duration=5m
booking.currency=INR
booking.max-seats-per-booking=10
booking.reference-prefix=MTB

# Safety net only. Lazy expiry (evaluated under the row lock) is what actually
# makes an expired seat bookable again, so correctness does not depend on this.
booking.hold-sweeper.enabled=true
booking.hold-sweeper.interval=PT30S
booking.hold-sweeper.batch-size=200

# ---------------------------------------------------------------------------
# Mock payment gateway
# Deterministic outcomes are selected by the payment method token supplied on
# the request: see MockPaymentGateway.
# ---------------------------------------------------------------------------
payment.mock.latency=0ms
payment.mock.default-outcome=SUCCESS

# ---------------------------------------------------------------------------
# Notifications
# Bounded executor: the booking request never waits for delivery.
# ---------------------------------------------------------------------------
notification.enabled=true
notification.executor.core-pool-size=4
notification.executor.max-pool-size=8
notification.executor.queue-capacity=1000
notification.executor.thread-name-prefix=notification-
notification.executor.await-termination=PT20S

# Reminder sweep for confirmed bookings whose show is about to start.
notification.reminder.enabled=true
notification.reminder.interval=PT60S
notification.reminder.lead-time=2h
notification.reminder.batch-size=100

# ---------------------------------------------------------------------------
# Refunds
# ---------------------------------------------------------------------------
refund.cancellation-cutoff-before-show=0m

# ---------------------------------------------------------------------------
# Actuator - health only, used by the docker-compose healthcheck.
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging.level.com.harshil.movieticketbooking=INFO
server.error.include-stacktrace=never
server.error.include-message=never
